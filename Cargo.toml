[package]
name = "lazypkg"
version = "0.2.0"
edition = "2021"
description = "Lazygit-style TUI to see, uninstall and sync every globally installed CLI tool across cargo, npm, pnpm, pip, pipx, pacman, apt, dnf, brew and gem"
license = "MIT"
repository = "https://github.com/itxmjr/LazyPkg"
# Keep the published crate small: CI config and demo media aren't needed to build or test.
exclude = [".github/", "assets/"]
keywords = ["tui", "package-manager", "cli", "dotfiles", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# rustls instead of OpenSSL: no system TLS library needed, so static/musl builds work
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
