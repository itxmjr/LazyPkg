name: 📦 Support a new package manager
description: Ask for (or volunteer to add) a package manager
labels: ["manager", "good first issue"]
body:
  - type: input
    id: name
    attributes:
      label: Package manager
      placeholder: e.g. pacman, apt, brew, flatpak, uv, go, gem
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: How to list installed packages (ideally machine-readable), install one, and uninstall one. Does it need root?
      placeholder: |
        list:      pacman -Qqe
        install:   sudo pacman -S --needed <name>
        uninstall: sudo pacman -Rns <name>
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample output of the list command
      description: A few lines from your machine help us write a parser test.
      render: shell
  - type: checkboxes
    id: volunteer
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this myself (see CONTRIBUTING.md → "Add a package manager in 30 minutes")
